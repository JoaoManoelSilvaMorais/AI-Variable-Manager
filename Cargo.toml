[package]
name = "ai-variable-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
description = "Gerenciador offline de dados variáveis e fotografias para Adobe Illustrator"

[features]
default = []
e2e_tests = []

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-18",
] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.41"
calamine = "0.38"
csv = "1.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rfd = "0.17"
walkdir = "2.5"
unicode-normalization = "0.1"
strsim = "0.11"
uuid = { version = "1.29", features = ["v4"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
directories = "6.0"
tempfile = "3.27"

[build-dependencies]
slint-build = "1.18"
